<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LST&ZZL</title>
<meta name="description" content="正在进入 LST&ZZL……">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
<style>
    body { margin: 0; background: #FFB7C5; font-family: "YouYuan", sans-serif; }
    .stage { position: relative; width: 100%; height: 100dvh; border: 0; display: block; }
    @supports not (height: 100dvh) { .stage { height: 100vh; } }
</style>
</head>
<body>
<!-- 同源 iframe 跳转：重写父级地址，避免出现「返回上一页」的死循环 -->
<script>
    (function () {
        var target = new URL("index.html", location.href).href;
        try {
            if (window.top && window.top !== window.self) {
                window.top.location.replace(target);
                document.write('<p style="text-align:center;font-weight:bold;color:#e91e63">正在进入……</p>');
            } else {
                location.replace(target);
            }
        } catch (e) {
            location.replace(target);
        }
    })();
</script>
</body>
</html>
