<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LST&ZZL</title>
<meta name="description" content="LST&ZZL 的入口页 —— 点击进入藏在弹窗里的祝福。">
<meta name="theme-color" content="#FFB7C5">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="LST&ZZL">
<meta property="og:description" content="点击进入藏在弹窗里的祝福。">
<meta property="og:url" content="https://zzl071214.github.io/">
<style>
    :root { --pink-bg: #FFB7C5; --pink-deep: #e91e63; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 28px;
        padding: 48px 22px;
        background-color: var(--pink-bg);
        font-family: "YouYuan", "幼圆", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
        font-weight: bold;
        text-align: center;
        color: var(--pink-deep);
    }

    .brand { font-size: clamp(30px, 9vw, 46px); letter-spacing: .02em; }

    .dates {
        font-size: clamp(15px, 4.2vw, 20px);
        line-height: 1.8;
        opacity: .92;
    }

    .enter {
        display: inline-block;
        margin-top: 6px;
        background-color: var(--pink-deep);
        color: #fff;
        text-decoration: none;
        border-radius: 30px;
        font-size: clamp(16px, 4.4vw, 19px);
        font-weight: bold;
        padding: 14px 42px;
        transition: transform .3s ease, opacity .3s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .enter:hover { transform: scale(1.05); opacity: .9; }
    .enter:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .hint { font-size: 13px; opacity: .7; }

    /* 想让它自动跳转而不是手动点击，取消下面注释并把上面 .enter 保留做兜底即可 */
    @media (prefers-reduced-motion: reduce) {
        .enter { transition: none; }
    }
</style>
</head>
<body>

    <h1 class="brand">LST&ZZL</h1>

    <p class="dates">
        始于 2026 年 3 月 29 日<br>
        终于 2026 年 9 月 25 日
    </p>

    <a class="enter" href="https://zzl071214.github.io/lst-blessing/">进入祝福页</a>

    <p class="hint">点击「打开」，让 300 份祝福弹出来</p>

</body>
</html>
